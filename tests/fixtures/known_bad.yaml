# Known-bad test cases for Phase 1a gate check 6. Never read by the scan or by any filter.
# The test runs with config/exclusions.yaml switched off, so a stock only passes if real rules stop it.
#
# tier A: warning signs were in the data before the event -> must not appear as a card in the
#         90 trading days before event_date; the report names the rule that stopped it.
# tier B: sudden shock -> no trade opened in that window may lose more than 3% of Satellite capital.
#
# event_date values are approximate (from news reports); T18 refines each to the first day of the
# main fall from prices. nifty500_verified is set by T19 from point-in-time membership; an entry
# that was not a member on event_date is kept but reported as "outside universe".

